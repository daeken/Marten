name: Marten
options:
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Marten:
    type: application
    platform: [iOS, macOS]
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.marten.native
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: '1,2'
  MartenTests:
    type: bundle.unit-test
    platform: [iOS, macOS]
    sources: [Tests]
    dependencies:
      - target: Marten_${platform}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.marten.native.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Marten-iOS:
    build:
      targets:
        Marten_iOS: all
    test:
      targets: [MartenTests_iOS]
  Marten-macOS:
    build:
      targets:
        Marten_macOS: all
    test:
      targets: [MartenTests_macOS]
